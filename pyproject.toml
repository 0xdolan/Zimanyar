[project]
name = "zimanyar-data"
version = "0.1.0"
description = "Data and fixture export for Zimanyar (zimankit to TypeScript); not a Python package"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=26.0.0",
    "zimankit==0.3.1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "git-cliff>=2.10",
    "ruff>=0.15",
    "shellcheck-py>=0.10",
]

[tool.uv]
package = false
# Wait seven days before resolving a newly published version (supply-chain safety).
exclude-newer = "7 days"
# zimankit is our own package, pinned to one version; it does not need to wait.
exclude-newer-package = { zimankit = "2026-12-31T00:00:00Z" }

[tool.ruff]
line-length = 110
target-version = "py313"
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
