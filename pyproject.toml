[project]
name = "zimanyar-data"
version = "0.0.0"
description = "Data and fixture export for Zimanyar (zimankit to TypeScript); not a Python package"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "git-cliff>=2.14.2",
    "ruff>=0.17.3",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
