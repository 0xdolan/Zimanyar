[project]
name = "zimanyar-data"
version = "0.0.0"
description = "Data and fixture export for Zimanyar (zimankit to TypeScript); not a Python package"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "git-cliff>=2.10",
    "ruff>=0.15",
    "shellcheck-py>=0.10",
]

[tool.uv]
package = false
# Wait seven days before resolving a newly published version (supply-chain safety).
exclude-newer = "7 days"

[tool.ruff]
line-length = 110
target-version = "py313"
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
