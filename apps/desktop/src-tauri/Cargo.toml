[package]
name = "zimanyar-desktop"
version = "0.1.0"
description = "Zimanyar for the Linux desktop"
license = "GPL-3.0-or-later"
repository = "https://github.com/0xdolan/Zimanyar"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "zimanyar_desktop_lib"
path = "src/lib.rs"
