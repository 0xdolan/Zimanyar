# For a later Flathub submission. Flathub builds offline, so a real submission also needs its generated sources.
app-id: io.github._0xdolan.Zimanyar
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: zimanyar-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # No --share=network: Zimanyar makes no network requests.
  - --filesystem=xdg-documents
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: zimanyar
    buildsystem: simple
    build-commands:
      - ar -x zimanyar_*_amd64.deb
      - tar -xf data.tar.gz
      - cp -r usr/* /app/
      - install -Dm644 packaging/linux/io.github._0xdolan.Zimanyar.metainfo.xml /app/share/metainfo/io.github._0xdolan.Zimanyar.metainfo.xml
    sources:
      - type: dir
        path: ../..
