<!doctype html>
<html lang="en" style="--w:1280px;--h:800px">
<head>
<meta charset="utf-8">
<title>Zimanyar store screenshot</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="components.js"></script>
<style>
  /* The interface in these images is real: Playwright screenshots of the built apps (make screenshots). */
  .caption { position: absolute; left: 64px; top: 52px; right: 64px; display: flex; align-items: center; gap: 18px; }
  .caption img { width: 54px; height: 54px; }
  .caption h1 { font-size: 38px; font-weight: 700; letter-spacing: -0.3px; }
  .caption p { color: var(--muted); font-size: 19px; margin-top: 4px; }
  .caption.side { top: 0; bottom: 0; right: auto; width: 330px; flex-direction: column; align-items: flex-start; justify-content: center; }
  .caption.side img { width: 64px; height: 64px; margin-bottom: 8px; }
  .caption.side h1 { font-size: 40px; line-height: 1.15; }
  .caption.side p { font-size: 20px; line-height: 1.45; margin-top: 14px; }
  .stage { position: absolute; left: 64px; right: 64px; top: 150px; bottom: 56px; }
  .abs { position: absolute; }
  .shot { display: block; object-fit: cover; object-position: left top; }
  .label { position: absolute; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--sun); }
</style>
</head>
<body>
<div class="rays"></div>
<div class="caption" id="caption"></div>
<div class="stage" id="stage"></div>
<script>
  const view = param("view", "check");
  const captions = {
    check: ["Underlines mistakes as you type", "Sorani and Kurmanji, in any text field, completely offline."],
    explain: ["Explains why, not just what", "Every finding has a reason, a fix, examples and lessons."],
    learn: ["Learn the rule behind the fix", "46 lessons from the alphabet to ergativity, with tables computed by the checker itself."],
    everywhere: ["Everywhere you write", "Chrome, Firefox and Safari extension, Linux desktop app and a command-line tool."],
  };
  const [title, sub] = captions[view];
  const caption = document.getElementById("caption");
  caption.innerHTML = `<img src="../../assets/icons/png/logo-128.png" alt=""><div><h1>${title}</h1><p>${sub}</p></div>`;
  const stage = document.getElementById("stage");
  const shot = (name) => `../../assets/screenshots/${name}.png`;

  /** A browser window around a screenshot, scaled to its width and cut to height. */
  const windowHTML = (name, { url, width, height, dark = false }) =>
    `<div class="window${dark ? " dark" : ""}" style="width:${width}px">
      <div class="titlebar"><div class="lights"><span></span><span></span><span></span></div><div class="url">${esc(url)}</div></div>
      <div style="height:${height}px;overflow:hidden"><img class="shot" src="${shot(name)}" alt="" style="width:${width}px"></div>
    </div>`;

  // The extension on a page where people write: 960 × 900 captures at 0.75, next to the caption.
  if (view === "check" || view === "explain") {
    caption.classList.add("side");
    stage.style.cssText = "left:466px;top:40px;bottom:40px;right:64px";
    const name = view === "check" ? "extension-store-ckb" : "extension-store-kmr";
    stage.innerHTML = windowHTML(name, { url: "mail.example", width: 720, height: 675 });
  }

  if (view === "learn") {
    stage.innerHTML = `<div class="abs" style="left:26px;top:0">${windowHTML("extension-lesson", { url: "Zimanyar · Learn", width: 1100, height: 550 })}</div>`;
  }

  if (view === "everywhere") {
    stage.innerHTML = `
      <span class="label" style="left:0;top:-4px">Browser popup</span>
      <div class="abs window" style="left:0;top:22px;width:300px;height:270px">
        <img class="shot" src="${shot("extension-popup-site")}" alt="" style="width:300px"></div>
      <span class="label" style="left:330px;top:-4px">Linux desktop</span>
      <div class="abs" style="left:330px;top:22px">${windowHTML("desktop-main", { url: "Zimanyar", width: 822, height: 226 })}</div>
      <span class="label" style="left:0;top:320px">Command line</span>
      <div class="abs window dark" style="left:0;top:346px;width:864px;height:242px">
        <img class="shot" src="${shot("cli-check")}" alt="" style="width:864px"></div>`;
  }
</script>
</body>
</html>
