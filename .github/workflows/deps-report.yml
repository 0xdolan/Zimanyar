name: Dependency report

# Monthly report of outdated and vulnerable dependencies in the job summary. Updates are made
# by the maintainer on a chore/deps-YYYY-MM branch; this workflow never commits or opens pull requests.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Report
        run: |
          {
            echo '### Dependency report'
            echo '```'
            make --no-print-directory deps 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
