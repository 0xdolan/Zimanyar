name: Screenshots

# Regenerate every screenshot and keep them as an artefact for the maintainer to look at and
# commit. This workflow never commits.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - run: make data
      - run: make screenshots
      - name: List what changed
        run: |
          {
            echo '### Changed screenshots'
            git status --porcelain -- assets/screenshots | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: assets/screenshots/
          retention-days: 14
