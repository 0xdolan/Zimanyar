name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make build

  data:
    name: Data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make data
      - name: Everything committed matches what the pinned bundle produces
        run: git diff --exit-code -- packages/data packages/core/src/generated
      - name: Check the compiled lexicons against the bundle
        run: pnpm --filter @zimanyar/data test
      - name: Check the engine against the full fixtures
        run: pnpm --filter @zimanyar/core test
      - name: Check the rules against the full lexicon
        run: pnpm --filter @zimanyar/rules test
      - name: Check the rules against the gold corpus
        run: make corpus
      - name: Hold the engine to its performance budgets
        run: pnpm --filter @zimanyar/core bench
      - name: Sizes
        run: |
          {
            echo '| file | bytes |'
            echo '| --- | --- |'
            for file in packages/data/build/lexicon-*.bin.gz; do
              echo "| $(basename "$file") | $(stat -c %s "$file") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - run: make data
      - run: make e2e
      - run: make extension-lint
      - name: Keep the built site, to look at before it reaches main
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-preview
          path: apps/web/dist/
          retention-days: 7
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  desktop:
    name: Desktop packages
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install what Tauri builds against, and the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            patchelf rpm lintian appstream desktop-file-utils xvfb xauth dbus-x11 xdotool xclip imagemagick
      - run: make data
      - name: Rust stays tidy
        run: |
          pnpm --filter @zimanyar/desktop build:web
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build the packages
        run: pnpm --filter @zimanyar/desktop exec tauri build --ci
        env:
          # The AppImage tool cannot mount itself on a runner, and strips nothing it does not understand.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
      - name: Check the .deb
        run: packaging/linux/check-package.sh "$CARGO_TARGET_DIR_BUNDLE"/deb/*.deb
        env:
          CARGO_TARGET_DIR_BUNDLE: apps/desktop/src-tauri/target/release/bundle
      - name: Install the .deb and start it
        run: |
          sudo apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          packaging/linux/smoke-test.sh smoke.png
      - name: Keep the packages and what the app looked like
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-packages
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            smoke.png
            smoke-quick.png
          retention-days: 7
