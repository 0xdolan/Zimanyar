name: Release

# A v* tag builds every artefact and leaves a draft GitHub Release; the maintainer then signs
# SHA256SUMS and publishes it with make release-sign (RELEASING.md). A pull request that changes
# the release tooling runs the same builds as a rehearsal and publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - packaging/**
      - debian/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: The tag names the version in package.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "::error::tag $REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  extension:
    name: Extensions
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make data
      - run: make extension-lint
      - name: Build for Safari
        run: pnpm --filter @zimanyar/extension exec wxt build -b safari --mv3
      - name: Pack the Chrome zip, the Firefox xpi and the source zip for AMO review
        run: |
          mkdir -p dist
          out=apps/extension/.output
          (cd "$out/chrome-mv3" && zip -qrX "$GITHUB_WORKSPACE/dist/zimanyar-chrome-$VERSION.zip" .)
          (cd "$out/firefox-mv3" && zip -qrX "$GITHUB_WORKSPACE/dist/zimanyar-firefox-$VERSION.xpi" .)
          git archive --format=zip --prefix="zimanyar-$VERSION/" -o "dist/zimanyar-firefox-$VERSION-source.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-build
          path: apps/extension/.output/safari-mv3/
          if-no-files-found: error
          retention-days: 1

  safari:
    name: Safari Xcode project
    needs: [version, extension]
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: safari-build
          path: safari-mv3
      - name: Convert the web extension into an Xcode project
        run: |
          xcrun safari-web-extension-converter safari-mv3 \
            --project-location xcode --app-name Zimanyar --bundle-identifier io.github.zimanyar.safari \
            --macos-only --copy-resources --swift --no-open --no-prompt --force
          mkdir -p dist
          (cd xcode && zip -qrXy "$GITHUB_WORKSPACE/dist/zimanyar-safari-$VERSION-xcode.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-safari
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop packages (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install what Tauri builds against, and the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            patchelf rpm lintian appstream desktop-file-utils xvfb xauth dbus-x11 xdotool xclip imagemagick
      - run: make data
      - name: Build the packages
        run: pnpm --filter @zimanyar/desktop exec tauri build --ci
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
      - name: Check, install and start the .deb
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          packaging/linux/check-package.sh "$bundle"/deb/*.deb
          sudo apt-get install -y "./$(ls "$bundle"/deb/*.deb)"
          packaging/linux/smoke-test.sh smoke.png
      - name: Name the packages
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          rpm_arch="$(rpm -qp --qf '%{ARCH}' "$bundle"/rpm/*.rpm)"
          mkdir -p dist
          cp "$bundle"/deb/*.deb "dist/zimanyar_${VERSION}_${ARCH}.deb"
          cp "$bundle"/rpm/*.rpm "dist/zimanyar-${VERSION}-1.${rpm_arch}.rpm"
          cp "$bundle"/appimage/*.AppImage "dist/zimanyar_${VERSION}_${ARCH}.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  cli:
    name: Command line packages (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, npm: true }
          - { runner: ubuntu-24.04-arm, arch: arm64, npm: false }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper lintian
      - run: make data
      - run: make cli-sea
      - name: Build the .deb and run lintian
        run: packaging/cli/build-deb.sh
      - name: Install the .deb and use it as a pipeline would (user story 6)
        run: |
          sudo apt-get install -y "./$(ls apps/cli/.output/zimanyar-cli_*.deb)"
          packaging/cli/smoke-test.sh
      - name: Pack the tarball
        run: packaging/cli/tarball.sh
      - name: Pack the npm package
        if: matrix.npm
        run: pnpm --filter zimanyar pack --pack-destination .output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-${{ matrix.arch }}
          path: |
            apps/cli/.output/*.deb
            apps/cli/.output/*.tar.gz
            apps/cli/.output/*.tgz
          if-no-files-found: error

  data:
    name: Data
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make data
      - name: Pack the compiled lexicons and tables with their licence
        run: |
          mkdir -p dist
          cd packages/data
          tar --zstd --owner=0 --group=0 --numeric-owner --transform "s|^|zimanyar-data-$VERSION/|" \
            -cf "$GITHUB_WORKSPACE/dist/zimanyar-data-$VERSION.tar.zst" \
            NOTICE VERSION lexicon.lock.json tables build/lexicon-ckb.bin.gz build/lexicon-kmr.bin.gz build/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-data
          path: dist/
          if-no-files-found: error

  publish:
    name: Draft the GitHub Release
    needs: [version, extension, safari, desktop, cli, data]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes
        run: scripts/release/release-notes.sh "$VERSION" > notes.md
      - name: Provenance attestations
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "Zimanyar $VERSION" --notes-file notes.md
      - name: Keep the rehearsal's files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal
          path: |
            dist/
            notes.md
          retention-days: 3
