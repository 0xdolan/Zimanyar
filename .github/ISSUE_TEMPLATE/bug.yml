name: Bug report
description: Something in Zimanyar does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Website, Chrome extension, Firefox extension, Safari extension, Linux desktop app, CLI, Language server]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zimanyar version
      description: Shown in Settings, About (or `zimanyar --version`).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the text you checked if it is not private.
